<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>حسن رمزي للفضيات</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="رمزي للفضة">
<meta name="application-name" content="رمزي للفضة">
<meta name="theme-color" content="#EEF0F1">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;height:100%;background:#EEF0F1;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#1B2220}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#EEF0F1;
       padding-top:env(safe-area-inset-top);box-sizing:border-box}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#EEF0F1;transition:opacity .3s;z-index:2}
  #splash.gone{opacity:0;pointer-events:none}
  #splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 6px 24px rgba(14,90,67,.18)}
  #splash b{font-size:18px;font-weight:600}
  .bar{width:120px;height:4px;border-radius:4px;background:#DCE0E1;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#0E5A43;border-radius:4px;animation:m 1.1s ease-in-out infinite}
  @keyframes m{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
  #slow{display:none;font-size:14px;color:#5F6866;text-align:center;line-height:1.8}
  #slow a{color:#0E5A43;font-weight:600}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <b>حسن رمزي للفضيات</b>
  <div class="bar"><i></i></div>
  <div id="slow">الاتصال بطيء…<br><a id="direct" href="#" target="_top">افتح النظام مباشرة</a></div>
</div>
<iframe id="app" title="نظام رمزي للفضة" allow="clipboard-write; camera; web-share"></iframe>
<script>
  // رابط النظام (Google Apps Script) — يُغيَّر هنا فقط عند النقل
  var SYSTEM_URL = 'https://script.google.com/macros/s/AKfycbzyPecmgO_EpzVvZurv2lLL0i8ksNTcRmAW7xc4t_ctwWPaDJ8dnucLs5LW_twH5_6W/exec';
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  document.getElementById('direct').href = SYSTEM_URL;
  f.addEventListener('load', function () { setTimeout(function () { sp.className = 'gone'; }, 250); });
  setTimeout(function () { if (sp.className !== 'gone') document.getElementById('slow').style.display = 'block'; }, 12000);
  f.src = SYSTEM_URL;
</script>
</body>
</html>
