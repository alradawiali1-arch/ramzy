<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>حسن رمزي للفضيات</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="رمزي للفضة">
<meta name="application-name" content="رمزي للفضة">
<meta name="theme-color" content="#EEF0F1">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;height:100%;background:#EEF0F1;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#1B2220}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#EEF0F1;
       padding-top:env(safe-area-inset-top);box-sizing:border-box}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#EEF0F1;transition:opacity .3s;z-index:2}
  #splash.gone{opacity:0;pointer-events:none}
  #splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 6px 24px rgba(14,90,67,.18)}
  #splash b{font-size:18px;font-weight:600}
  .bar{width:120px;height:4px;border-radius:4px;background:#DCE0E1;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#0E5A43;border-radius:4px;animation:m 1.1s ease-in-out infinite}
  @keyframes m{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
  #slow{display:none;font-size:14px;color:#5F6866;text-align:center;line-height:1.8}
  #slow a{color:#0E5A43;font-weight:600}
  #bell{position:fixed;z-index:3;display:none;margin:0;padding:0;border:0;border-radius:14px;background:transparent;opacity:0;-webkit-tap-highlight-color:transparent}
  #bell.on{display:block}
  #pmsg{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 54px);z-index:3;display:none;padding:10px 12px;border-radius:12px;background:#1B2220;color:#fff;font-size:13px;line-height:1.7;text-align:center}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <b>حسن رمزي للفضيات</b>
  <div class="bar"><i></i></div>
  <div id="slow">الاتصال بطيء…<br><a id="direct" href="#" target="_top">افتح النظام مباشرة</a></div>
</div>
<button id="bell" type="button" aria-label="تفعيل إشعارات الهاتف"></button>
<div id="pmsg"></div>
<iframe id="app" title="نظام رمزي للفضة" allow="clipboard-write; camera; web-share"></iframe>
<script>
  // رابط النظام (Google Apps Script) — يُغيَّر هنا فقط عند النقل
  var SYSTEM_URL = 'https://script.google.com/macros/s/AKfycbzyPecmgO_EpzVvZurv2lLL0i8ksNTcRmAW7xc4t_ctwWPaDJ8dnucLs5LW_twH5_6W/exec';
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  document.getElementById('direct').href = SYSTEM_URL;
  f.addEventListener('load', function () { setTimeout(function () { sp.className = 'gone'; }, 250); });
  setTimeout(function () { if (sp.className !== 'gone') document.getElementById('slow').style.display = 'block'; }, 12000);
  f.src = SYSTEM_URL;
</script>

<script>
  /* إشعارات الهاتف: الغلاف (هذه الصفحة) يسجّل الـ Service Worker ويطلب الإذن، والتطبيق داخل الإطار يربط الاشتراك بحساب المستخدم */
  var PUSH_WORKER = 'https://ramzy-push.alradawi.workers.dev'; // رابط الـ Worker، مثل https://ramzy-push.xxxx.workers.dev
  (function () {
    var bell = document.getElementById('bell'), pmsg = document.getElementById('pmsg');
    var lastSrc = null, lastOrigin = '*', allowed = false, slot = null, need = false;
    function supported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
    function standalone() { return window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches); }
    function u8(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), o = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; }
    function say(t) { pmsg.textContent = t; pmsg.style.display = 'block'; setTimeout(function () { pmsg.style.display = 'none'; }, 5000); }
    function getSub() {
      if (!supported()) return Promise.resolve(null);
      return navigator.serviceWorker.getRegistration('/').then(function (r) { return r ? r.pushManager.getSubscription() : null; });
    }
    function state() {
      return getSub().then(function (sub) {
        return { t: 'rz-push', supported: supported(), perm: ('Notification' in window) ? Notification.permission : '', standalone: standalone(), sub: sub ? sub.toJSON() : null };
      }, function () { return { t: 'rz-push', supported: supported(), perm: '', standalone: standalone(), sub: null }; });
    }
    // الزر الشفاف يوضع فوق أيقونة الجرس الموجودة داخل هيدر النظام (الإحداثيات تأتي من النظام)
    function place() {
      if (need && slot) {
        bell.style.left = slot.x + 'px'; bell.style.top = 'calc(env(safe-area-inset-top) + ' + slot.y + 'px)';
        bell.style.width = slot.w + 'px'; bell.style.height = slot.h + 'px'; bell.className = 'on';
      } else bell.className = '';
    }
    function sendState() {
      return state().then(function (m) {
        need = (allowed && m.supported && m.perm !== 'denied' && !m.sub && PUSH_WORKER.indexOf('REPLACE') < 0); place();
        if (lastSrc) { try { lastSrc.postMessage(m, lastOrigin); } catch (e) {} }
      });
    }
    window.addEventListener('message', function (e) {
      var d = e.data; if (!d || (d.t !== 'rz-hello' && d.t !== 'rz-slot')) return;
      var h; try { h = new URL(e.origin).hostname; } catch (x) { return; }
      if (!(h === 'script.google.com' || /(^|\.)googleusercontent\.com$/.test(h))) return;
      if (d.t === 'rz-slot') { var r = d.r; slot = (r && isFinite(r.x) && isFinite(r.y) && isFinite(r.w) && isFinite(r.h)) ? { x: +r.x, y: +r.y, w: +r.w, h: +r.h } : null; place(); return; }
      lastSrc = e.source; lastOrigin = e.origin; allowed = !!d.allowed;
      sendState();
    });
    // إن كان الإذن ممنوحاً مسبقاً نسجّل الـ Service Worker بصمت
    if (supported() && Notification.permission === 'granted') navigator.serviceWorker.register('/sw.js').catch(function () {});
    bell.addEventListener('click', function () {
      // مهم: طلب الإذن لازم يكون أول استدعاء داخل النقرة (شرط iOS)
      var p; try { p = Notification.requestPermission(); } catch (e) { say('تعذّر طلب إذن الإشعارات'); return; }
      Promise.resolve(p).then(function (perm) {
        if (perm !== 'granted') { say('لم يتم السماح بالإشعارات'); return sendState(); }
        return navigator.serviceWorker.register('/sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function (reg) {
          return fetch(PUSH_WORKER.replace(/\/+$/, '') + '/vapid').then(function (r) { return r.json(); }).then(function (j) {
            return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(j.key) });
          });
        }).then(function () { say('تم تفعيل الإشعارات على هذا الجهاز ✅'); return sendState(); });
      }).catch(function (err) { say('تعذّر التفعيل: ' + String(err && err.message || err).slice(0, 80)); });
    });
  })();
</script>
</body>
</html>
